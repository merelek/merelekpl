            let currentEra = '';

                    eraHeader.className = 'mt-6 mb-2 first:mt-0';
                    eraHeader.innerHTML = `<span class="text-xs font-bold text-neutral-500 uppercase tracking-widest pl-2">${q.era}</span>`;
                    sidebarList.appendChild(eraHeader);
                    currentEra = q.era;
                }

                const btn = document.createElement('button');
                btn.id = `btn-${q.id}`;
                btn.className = `w-full text-left p-2.5 pl-4 leading-relaxed rounded-md transition-colors duration-200 border-l-2 border-transparent hover:bg-neutral-800 hover:text-white text-neutral-400 group`;

                    <div class="text-xs font-medium text-neutral-300 group-hover:text-white">${q.title}</div>
                    <div class="text-[10px] mt-1.5 text-neutral-500 uppercase tracking-wide group-hover:text-neutral-400">${q.source}</div>
                `;

                btn.onclick = () => selectQuestion(q.id);
                sidebarList.appendChild(btn);
            });
        }

            // Update active state w sidebarze
            if (activeQuestionId) {
                const prevBtn = document.getElementById(`btn-${activeQuestionId}`);
                if (prevBtn) {
                    prevBtn.classList.remove('bg-neutral-800', 'border-accent');
                    prevBtn.classList.add('border-transparent');
                    prevBtn.querySelector('.font-medium').classList.remove('text-white');
                    prevBtn.querySelector('.font-medium').classList.add('text-neutral-300');
                }
            }
            activeQuestionId = id;
            const currentBtn = document.getElementById(`btn-${id}`);
            if (currentBtn) {
                currentBtn.classList.add('bg-neutral-800', 'border-accent');
                currentBtn.classList.remove('border-transparent');
                currentBtn.querySelector('.font-medium').classList.add('text-white');
                currentBtn.querySelector('.font-medium').classList.remove('text-neutral-300');
            }

                        <div class="absolute top-0 left-0 w-1.5 h-full ${sec.badgeColor}"></div>
                        
                        <!-- Nagłówek sekcji z badge'm -->
                        <div class="flex items-center gap-4 mb-5 ml-2">
                            <span class="flex items-center justify-center min-w-[2rem] w-8 h-8 rounded-full ${sec.badgeColor} text-white font-bold text-sm shadow-md">

                            </span>
                            <h3 class="text-white font-bold text-xl tracking-wide">${sec.title}</h3>
                        </div>

                        <ul class="list-disc space-y-3 text-neutral-300 ml-10 mr-2 marker:text-neutral-600">
