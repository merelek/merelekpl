<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Kalendarz / Planer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #ffffff;
            --once-color: #3b82f6;
            --cyclic-color: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Menu Boczne */
        aside {
            width: 250px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        aside .logo {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        aside nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 10px;
        }

        aside nav a {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        aside nav a:hover, aside nav a.active {
            background-color: var(--primary);
            color: var(--sidebar-active);
        }

        /* Główna zawartość z kalendarzem */
        main {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header.calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        .nav-btns button, .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .nav-btns button:hover, .btn:hover { background-color: var(--primary-hover); }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .calendar-card, .form-card, .day-details-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .calendar-day:hover { background: #e2e8f0; }
        .calendar-day.selected { border: 2px solid var(--primary); }
        .calendar-day.other-month { opacity: 0.3; }

        .day-number { font-size: 0.9rem; font-weight: 600; }
        .dots-container { display: flex; gap: 3px; flex-wrap: wrap; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot.once { background-color: var(--once-color); }
        .dot.cyclic { background-color: var(--cyclic-color); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }

        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); gap: 10px; }
        .task-item.completed span.task-text { text-decoration: line-through; color: #94a3b8; }
        .task-info { display: flex; flex-direction: column; gap: 3px; flex-grow: 1; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; width: fit-content; }
        .badge.once { background-color: var(--once-color); }
        .badge.cyclic { background-color: var(--cyclic-color); }
        .task-actions button { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px; }
        .delete-btn { color: #ef4444; }
        .check-btn { color: #10b981; }
    </style>
</head>
<body>

    <!-- Menu Boczne -->
    <aside>
        <div class="logo">⚡ Mój Portal</div>
        <nav>
            <a href="index.html">🏠 Strona Główna</a>
            <a href="kalendarz.html" class="active">📅 Kalendarz / Planer</a>
            <a href="zadania.html">✅ Lista Zadań</a>
            <a href="notatki.html">📝 Notatki</a>
        </nav>
    </aside>

    <!-- Główna Zawartość - Kalendarz -->
    <main>
        <header class="calendar-header">
            <h1 id="month-year-display">Miesiąc Rok</h1>
            <div class="nav-btns">
                <button onclick="changeMonth(-1)">&lt; Poprzedni</button>
                <button onclick="goToCurrentMonth()">Dzisiaj</button>
                <button onclick="changeMonth(1)">Następny &gt;</button>
            </div>
        </header>

        <main class="main-grid" style="padding: 0; overflow: visible;">
            <div class="calendar-card">
                <div class="weekdays">
                    <div>Pon</div><div>Wt</div><div>Śr</div><div>Czw</div><div>Pt</div><div>Sob</div><div>Ndz</div>
                </div>
                <div class="days-grid" id="calendar-days"></div>
            </div>

            <div>
                <div class="form-card">
                    <h3>Dodaj wydarzenie</h3>
                    <form id="task-form" onsubmit="handleAddTask(event)">
                        <div class="form-group">
                            <label for="task-title">Nazwa zadania:</label>
                            <input type="text" id="task-title" required placeholder="np. Trening, Spotkanie...">
                        </div>
                        
                        <div class="form-group">
                            <label for="task-type">Typ wydarzenia:</label>
                            <select id="task-type" onchange="toggleTypeFields()">
                                <option value="once">Jednorazowe</option>
                                <option value="cyclic">Cykliczne (co tydzień)</option>
                            </select>
                        </div>

                        <div class="form-group" id="group-date">
                            <label for="task-date">Data:</label>
                            <input type="date" id="task-date">
                        </div>

                        <div class="form-group" id="group-day-of-week" style="display: none;">
                            <label for="task-dow">Dzień tygodnia:</label>
                            <select id="task-dow">
                                <option value="1">Poniedziałek</option>
                                <option value="2">Wtorek</option>
                                <option value="3">Środa</option>
                                <option value="4">Czwartek</option>
                                <option value="5">Piątek</option>
                                <option value="6">Sobota</option>
                                <option value="0">Niedziela</option>
                            </select>
                        </div>

                        <button type="submit" class="btn" style="width: 100%;">Dodaj do planera</button>
                    </form>
                </div>

                <div class="day-details-card">
                    <h3 id="selected-date-title">Wybierz dzień</h3>
                    <ul class="task-list" id="selected-day-tasks"></ul>
                </div>
            </div>
        </main>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDateStr = formatDateString(new Date());
        let tasks = JSON.parse(localStorage.getItem('planner_tasks')) || [];

        function formatDateString(date) {
            let d = new Date(date),
                month = '' + (d.getMonth() + 1),
                day = '' + d.getDate(),
                year = d.getFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;

            return [year, month, day].join('-');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('task-date').value = selectedDateStr;
            renderCalendar();
            renderSelectedDayTasks();
        });

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToCurrentMonth() {
            currentDate = new Date();
            renderCalendar();
        }

        function toggleTypeFields() {
            const type = document.getElementById('task-type').value;
            if (type === 'once') {
                document.getElementById('group-date').style.display = 'block';
                document.getElementById('group-day-of-week').style.display = 'none';
            } else {
                document.getElementById('group-date').style.display = 'none';
                document.getElementById('group-day-of-week').style.display = 'block';
            }
        }

        function isTaskOnDate(task, dateStr) {
            let d = new Date(dateStr);
            if (task.type === 'once') {
                return task.date === dateStr;
            } else if (task.type === 'cyclic') {
                return d.getDay() === parseInt(task.dayOfWeek);
            }
            return false;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
            document.getElementById('month-year-display').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            let startingDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            for (let i = startingDay; i > 0; i--) {
                let dayNum = prevTotalDays - i + 1;
                let d = new Date(year, month - 1, dayNum);
                let dStr = formatDateString(d);
                createDayCell(daysContainer, dStr, dayNum, true);
            }

            for (let i = 1; i <= totalDays; i++) {
                let d = new Date(year, month, i);
                let dStr = formatDateString(d);
                createDayCell(daysContainer, dStr, i, false);
            }

            let totalCellsPrinted = startingDay + totalDays;
            let nextMonthDays = totalCellsPrinted <= 35 ? 35 - totalCellsPrinted : 42 - totalCellsPrinted;
            for (let i = 1; i <= nextMonthDays; i++) {
                let d = new Date(year, month + 1, i);
                let dStr = formatDateString(d);
                createDayCell(daysContainer, dStr, i, true);
            }
        }

        function createDayCell(container, dateStr, dayNum, isOtherMonth) {
            const cell = document.createElement('div');
            cell.className = `calendar-day ${isOtherMonth ? 'other-month' : ''}`;
            if (dateStr === selectedDateStr) cell.classList.add('selected');

            cell.onclick = () => {
                selectedDateStr = dateStr;
                document.getElementById('task-date').value = dateStr;
                renderCalendar();
                renderSelectedDayTasks();
            };

            const numberSpan = document.createElement('span');
            numberSpan.className = 'day-number';
            numberSpan.innerText = dayNum;
            cell.appendChild(numberSpan);

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'dots-container';
            
            tasks.forEach(task => {
                if (isTaskOnDate(task, dateStr)) {
                    const dot = document.createElement('div');
                    dot.className = `dot ${task.type}`;
                    dotsContainer.appendChild(dot);
                }
            });

            cell.appendChild(dotsContainer);
            container.appendChild(cell);
        }

        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const type = document.getElementById('task-type').value;
            
            let newTask = {
                id: Date.now(),
                title: title,
                type: type,
                completed: false
            };

            if (type === 'once') {
                newTask.date = document.getElementById('task-date').value;
            } else {
                newTask.dayOfWeek = document.getElementById('task-dow').value;
            }

            tasks.push(newTask);
            localStorage.setItem('planner_tasks', JSON.stringify(tasks));

            document.getElementById('task-title').value = '';
            renderCalendar();
            renderSelectedDayTasks();
        }

        function renderSelectedDayTasks() {
            const titleEl = document.getElementById('selected-date-title');
            titleEl.innerText = `Zadania na dzień: ${selectedDateStr}`;

            const listEl = document.getElementById('selected-day-tasks');
            listEl.innerHTML = '';

            const dayTasks = tasks.filter(task => isTaskOnDate(task, selectedDateStr));

            if (dayTasks.length === 0) {
                listEl.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">Brak zadań na ten jeden dzień.</p>';
                return;
            }

            dayTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;

                const daysNamesMap = { '0': 'Niedziela', '1': 'Poniedziałek', '2': 'Wtorek', '3': 'Środa', '4': 'Czwartek', '5': 'Piątek', '6': 'Sobota' };
                const badgeText = task.type === 'once' ? 'Jednorazowe' : `Cykliczne (${daysNamesMap[task.dayOfWeek]})`;

                li.innerHTML = `
                    <div class="task-info">
                        <span class="task-text">${escapeHtml(task.title)}</span>
                        <span class="badge ${task.type}">${badgeText}</span>
                    </div>
                    <div class="task-actions">
                        <button class="check-btn" onclick="toggleTask(${task.id})" title="Zmień status">✓</button>
                        <button class="delete-btn" onclick="deleteTask(${task.id})" title="Usuń">✕</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        function toggleTask(id) {
            tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
            localStorage.setItem('planner_tasks', JSON.stringify(tasks));
            renderSelectedDayTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            localStorage.setItem('planner_tasks', JSON.stringify(tasks));
            renderCalendar();
            renderSelectedDayTasks();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
