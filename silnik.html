<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sterowanie Roletą – merelek.pl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <!-- Nagłówek -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Roleta Pokojowa</h1>
        <p id="limit-info" class="text-xs text-zinc-400 mt-0.5">Oczekiwanie na pozycję...</p>
      </div>
      <span id="status" class="text-xs font-medium px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400">
        Łączenie...
      </span>
    </div>

    <!-- Poglądowa wizualizacja okna i rolety -->
    <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-5 mb-6 flex flex-col items-center">
      <!-- Kaseta rolety na górze -->
      <div class="w-48 h-3 bg-zinc-700 rounded-t-md shadow"></div>
      
      <!-- Rama okienna -->
      <div class="relative w-44 h-56 border-4 border-zinc-700 bg-gradient-to-b from-sky-900/40 to-indigo-950/40 overflow-hidden shadow-inner">
        <!-- Szprosy okna w tle -->
        <div class="absolute inset-y-0 left-1/2 w-1 bg-zinc-700/60 -translate-x-1/2"></div>
        <div class="absolute inset-x-0 top-1/2 h-1 bg-zinc-700/60 -translate-y-1/2"></div>

        <!-- Materiał rolety (wysokość sterowana przez JS w %) -->
        <div id="blind-fabric" style="height: 0%;" class="relative w-full bg-zinc-800 border-b-4 border-zinc-500 transition-all duration-150 ease-out flex flex-col justify-end">
          <!-- Delikatne prążki materiału -->
          <div class="w-full h-full opacity-20 bg-[repeating-linear-gradient(0deg,transparent,transparent_6px,#000_6px,#000_7px)]"></div>
        </div>
      </div>

      <!-- Parapet -->
      <div class="w-52 h-2.5 bg-zinc-700 rounded-b-md"></div>

      <!-- Licznik procentowy -->
      <div class="mt-4 flex items-baseline gap-1">
        <span id="percent-text" class="text-4xl font-extrabold text-white">0</span>
        <span class="text-lg font-semibold text-zinc-400">% zasłonięcia</span>
      </div>
    </div>

    <!-- Przyciski sterowania -->
    <div class="grid grid-cols-2 gap-4">
      <button 
        id="btn-up"
        onmousedown="sendCmd('ccw')" onmouseup="sendCmd('stop')" onmouseleave="sendCmd('stop')"
        ontouchstart="sendCmd('ccw'); event.preventDefault();" ontouchend="sendCmd('stop')"
        class="bg-zinc-800 hover:bg-zinc-700 active:bg-blue-600 text-white font-semibold py-5 rounded-xl select-none transition cursor-pointer flex flex-col items-center justify-center gap-1">
        <span class="text-lg">&uarr;</span>
        <span>OTWÓRZ (0%)</span>
      </button>

      <button 
        id="btn-down"
        onmousedown="sendCmd('cw')" onmouseup="sendCmd('stop')" onmouseleave="sendCmd('stop')"
        ontouchstart="sendCmd('cw'); event.preventDefault();" ontouchend="sendCmd('stop')"
        class="bg-zinc-800 hover:bg-zinc-700 active:bg-blue-600 text-white font-semibold py-5 rounded-xl select-none transition cursor-pointer flex flex-col items-center justify-center gap-1">
        <span class="text-lg">&darr;</span>
        <span>ZAMKNIJ (100%)</span>
      </button>
    </div>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-zinc-400 hover:text-white transition">&larr; Powrót na stronę główną</a>
    </div>
  </div>

  <script>
    const TOPIC_CMD = "merelek/silnik/k9x82mQ74pL19z/ruch";
    const TOPIC_STATUS = "merelek/silnik/k9x82mQ74pL19z/status";

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
    let lastCmd = "stop";

    client.on("connect", () => {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Online";
      statusEl.className = "text-xs font-medium px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400";
      
      // Subskrybuj kanał zwrotny z procentami
      client.subscribe(TOPIC_STATUS);
    });

    client.on("message", (topic, message) => {
      if (topic === TOPIC_STATUS) {
        const pct = parseInt(message.toString(), 10);
        if (!isNaN(pct)) {
          updateVisual(pct);
        }
      }
    });

    function updateVisual(pct) {
      document.getElementById("percent-text").innerText = pct;
      document.getElementById("blind-fabric").style.height = pct + "%";

      const infoEl = document.getElementById("limit-info");
      if (pct <= 0) {
        infoEl.innerText = "Krańcówka: Całkowicie otwarta";
        infoEl.className = "text-xs text-emerald-400 mt-0.5";
      } else if (pct >= 100) {
        infoEl.innerText = "Krańcówka: Całkowicie zasłonięta";
        infoEl.className = "text-xs text-blue-400 mt-0.5";
      } else {
        infoEl.innerText = "Pozycja pośrednia";
        infoEl.className = "text-xs text-zinc-400 mt-0.5";
      }
    }

    function sendCmd(cmd) {
      if (cmd === lastCmd) return;
      lastCmd = cmd;
      client.publish(TOPIC_CMD, cmd);
    }
  </script>

</body>
</html>
