<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Portal - Strona Główna</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Boczny pasek nawigacji */
        aside {
            width: 250px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        aside .logo {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        aside nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 10px;
        }

        aside nav a {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        aside nav a:hover, aside nav a.active {
            background-color: var(--primary);
            color: var(--sidebar-active);
        }

        /* Główna zawartość strony głównej */
        main {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .welcome-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        h1 { margin-top: 0; color: var(--primary); }
    </style>
</head>
<body>

    <!-- Menu Boczne -->
    <aside>
        <div class="logo">⚡ Mój Portal</div>
        <nav>
            <a href="index.html" class="active">🏠 Strona Główna</a>
            <a href="kalendarz.html">📅 Kalendarz / Planer</a>
            <a href="zadania.html">✅ Lista Zadań</a>
            <a href="notatki.html">📝 Notatki</a>
        </nav>
    </aside>

    <!-- Główna Zawartość -->
    <main>
        <div class="welcome-card">
            <h1>Witaj na swojej stronie głównej!</h1>
            <p>Wybierz opcję z menu po lewej stronie, aby przejść do kalendarza lub innych sekcji.</p>
        </div>
    </main>

</body>
</html>
